<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Teacher Details')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Back Button -->
            <a href="/teachers" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-6">
                <i class="fas fa-arrow-left mr-2"></i> Back to Teachers
            </a>

            <!-- Teacher Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="gradient-bg px-6 py-8">
                    <div class="flex items-center">
                        <div class="h-20 w-20 rounded-full bg-white/20 flex items-center justify-center">
                            <i class="fas fa-chalkboard-teacher text-white text-3xl"></i>
                        </div>
                        <div class="ml-6">
                            <h1 class="text-2xl font-bold text-white" th:text="${teacher.name}">Teacher Name</h1>
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-yellow-400 text-yellow-900">
                                <i class="fas fa-star mr-1"></i> Faculty Member
                            </span>
                        </div>
                    </div>
                </div>

                <div class="p-6">
                    <!-- Info Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-2">Email</h3>
                            <p class="text-gray-900 flex items-center">
                                <i class="fas fa-envelope text-gray-400 mr-2"></i>
                                <span th:text="${teacher.email}">email@example.com</span>
                            </p>
                        </div>
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-2">Department</h3>
                            <p class="text-gray-900 flex items-center">
                                <i class="fas fa-building text-gray-400 mr-2"></i>
                                <span th:text="${teacher.departmentName ?: 'Not Assigned'}">Department</span>
                            </p>
                        </div>
                    </div>

                    <!-- Note about permissions -->
                    <div class="mt-6 p-4 bg-blue-50 rounded-lg">
                        <p class="text-sm text-blue-700">
                            <i class="fas fa-info-circle mr-2"></i>
                            Teachers can view each other's profiles but cannot modify them. Only administrators can manage teacher accounts.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
