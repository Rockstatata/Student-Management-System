<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Teacher Details')}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Back Button -->
            <a href="/teachers" class="inline-flex items-center text-gray-500 hover:text-gray-700 mb-6 font-medium">
                <i class="fas fa-arrow-left mr-2"></i> Back to Teachers
            </a>

            <!-- Teacher Card -->
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                <!-- Header -->
                <div class="bg-gradient-to-r from-amber-500 to-orange-500 px-8 py-10">
                    <div class="flex items-center">
                        <div class="w-20 h-20 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center">
                            <i class="fas fa-chalkboard-teacher text-white text-3xl"></i>
                        </div>
                        <div class="ml-6">
                            <h1 class="text-2xl font-bold text-white" th:text="${teacher.name}">Teacher Name</h1>
                            <span class="inline-flex items-center px-3 py-1 mt-2 bg-white/20 backdrop-blur rounded-lg text-white text-sm font-medium">
                                <i class="fas fa-star mr-2"></i> Faculty Member
                            </span>
                        </div>
                    </div>
                </div>

                <div class="p-8">
                    <!-- Info Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                        <div class="flex items-start space-x-4">
                            <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-envelope text-gray-500"></i>
                            </div>
                            <div>
                                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Email</h3>
                                <p class="text-gray-900 font-medium" th:text="${teacher.email}">email@example.com</p>
                            </div>
                        </div>
                        <div class="flex items-start space-x-4">
                            <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-building text-gray-500"></i>
                            </div>
                            <div>
                                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Department</h3>
                                <p class="text-gray-900 font-medium" th:text="${teacher.departmentName ?: 'Not Assigned'}">Department</p>
                            </div>
                        </div>
                    </div>

                    <!-- Note about permissions -->
                    <div class="p-5 bg-primary-50 rounded-2xl border border-primary-100">
                        <div class="flex items-start">
                            <div class="w-10 h-10 rounded-xl bg-primary-100 flex items-center justify-center flex-shrink-0 mr-4">
                                <i class="fas fa-info text-primary-600"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold text-primary-900 mb-1">Permissions</h3>
                                <p class="text-sm text-primary-700">
                                    Teachers can view each other's profiles but cannot modify them. Only administrators can manage teacher accounts.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
