<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Teachers')}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Alerts -->
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center">
                        <i class="fas fa-chalkboard-teacher text-amber-600 text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Teachers</h1>
                        <p class="text-gray-500">View all faculty members</p>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(teachers)}" class="text-center py-16 bg-white rounded-2xl border border-gray-100">
                <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-chalkboard-teacher text-3xl text-gray-400"></i>
                </div>
                <p class="text-gray-500 text-lg">No teachers found</p>
            </div>

            <!-- Teachers Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" th:unless="${#lists.isEmpty(teachers)}">
                <div th:each="teacher : ${teachers}"
                     class="bg-white rounded-2xl border border-gray-100 overflow-hidden card-hover">
                    <div class="p-6">
                        <div class="flex items-center mb-4">
                            <div class="w-14 h-14 rounded-xl bg-amber-100 flex items-center justify-center">
                                <i class="fas fa-chalkboard-teacher text-amber-600 text-xl"></i>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-lg font-bold text-gray-900" th:text="${teacher.name}">Teacher Name</h3>
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-amber-100 text-amber-700">
                                    <i class="fas fa-star mr-1"></i> Faculty
                                </span>
                            </div>
                        </div>
                        <div class="space-y-3">
                            <div class="flex items-center text-sm text-gray-600">
                                <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                                    <i class="fas fa-envelope text-gray-400"></i>
                                </div>
                                <span th:text="${teacher.email}">email@example.com</span>
                            </div>
                            <div class="flex items-center text-sm text-gray-600">
                                <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center mr-3">
                                    <i class="fas fa-building text-gray-400"></i>
                                </div>
                                <span th:text="${teacher.departmentName ?: 'Not Assigned'}">Department</span>
                            </div>
                        </div>
                    </div>
                    <div class="px-6 py-4 bg-gray-50/50 border-t border-gray-100">
                        <a th:href="@{/teachers/{id}(id=${teacher.id})}"
                           class="text-primary-600 hover:text-primary-700 text-sm font-medium">
                            View Profile <i class="fas fa-arrow-right ml-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
