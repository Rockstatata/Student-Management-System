<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Teachers')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Alerts -->
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">
                        <i class="fas fa-chalkboard-teacher text-yellow-600 mr-2"></i> Teachers
                    </h1>
                    <p class="mt-2 text-gray-600">View all faculty members</p>
                </div>
            </div>

            <!-- Teachers Grid -->
            <div th:if="${#lists.isEmpty(teachers)}" class="text-center py-12 bg-white rounded-xl shadow-sm">
                <i class="fas fa-chalkboard-teacher text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg">No teachers found</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" th:unless="${#lists.isEmpty(teachers)}">
                <div th:each="teacher : ${teachers}"
                     class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden card-hover">
                    <div class="p-6">
                        <div class="flex items-center">
                            <div class="h-14 w-14 rounded-full bg-yellow-100 flex items-center justify-center">
                                <i class="fas fa-chalkboard-teacher text-yellow-600 text-xl"></i>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-lg font-semibold text-gray-900" th:text="${teacher.name}">Teacher Name</h3>
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 text-yellow-800">
                                    Teacher
                                </span>
                            </div>
                        </div>
                        <div class="mt-4 space-y-2">
                            <p class="text-sm text-gray-600 flex items-center">
                                <i class="fas fa-envelope text-gray-400 mr-2 w-4"></i>
                                <span th:text="${teacher.email}">email@example.com</span>
                            </p>
                            <p class="text-sm text-gray-600 flex items-center">
                                <i class="fas fa-building text-gray-400 mr-2 w-4"></i>
                                <span th:text="${teacher.departmentName ?: 'Not Assigned'}">Department</span>
                            </p>
                        </div>
                    </div>
                    <div class="px-6 py-3 bg-gray-50 border-t">
                        <a th:href="@{/teachers/{id}(id=${teacher.id})}"
                           class="text-primary-600 hover:text-primary-700 text-sm font-medium">
                            <i class="fas fa-eye mr-1"></i> View Profile
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
