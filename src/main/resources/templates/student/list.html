<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Alerts -->
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">
                        <i class="fas fa-user-graduate text-green-600 mr-2"></i> Students
                    </h1>
                    <p class="mt-2 text-gray-600">Manage student records</p>
                </div>
                <div class="mt-4 md:mt-0" sec:authorize="hasRole('TEACHER')">
                    <a href="/students/new"
                       class="inline-flex items-center px-4 py-2 gradient-bg text-white rounded-lg hover:opacity-90 transition-opacity shadow-md">
                        <i class="fas fa-user-plus mr-2"></i> Add Student
                    </a>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
                <form method="get" action="/students" class="flex flex-wrap items-center gap-4">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Department</label>
                        <select name="departmentId"
                                onchange="this.form.submit()"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            <option value="">All Departments</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}"
                                    th:selected="${dept.id == selectedDepartmentId}">Department</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <a href="/students" class="px-4 py-2 text-gray-600 hover:text-gray-900">
                            <i class="fas fa-times mr-1"></i> Clear Filter
                        </a>
                    </div>
                </form>
            </div>

            <!-- Students Table -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center py-12 bg-white rounded-xl shadow-sm">
                <i class="fas fa-user-graduate text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg">No students found</p>
                <a href="/students/new" class="mt-4 inline-flex items-center text-primary-600 hover:text-primary-700" sec:authorize="hasRole('TEACHER')">
                    <i class="fas fa-user-plus mr-1"></i> Add your first student
                </a>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" th:unless="${#lists.isEmpty(students)}">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Roll Number</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Department</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="student : ${students}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex items-center">
                                    <div class="h-10 w-10 rounded-full bg-green-100 flex items-center justify-center">
                                        <i class="fas fa-user text-green-600"></i>
                                    </div>
                                    <div class="ml-4">
                                        <div class="text-sm font-medium text-gray-900" th:text="${student.name}">Name</div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-1 text-xs font-medium bg-gray-100 text-gray-800 rounded" th:text="${student.roll}">Roll</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="text-sm text-gray-600" th:text="${student.departmentName ?: 'Unassigned'}">Department</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${student.email}">Email</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <a th:href="@{/students/{id}(id=${student.id})}" class="text-primary-600 hover:text-primary-900 mr-3">
                                    <i class="fas fa-eye"></i> View
                                </a>
                                <span sec:authorize="hasRole('TEACHER')">
                                    <a th:href="@{/students/{id}/edit(id=${student.id})}" class="text-gray-600 hover:text-gray-900 mr-3">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="inline"
                                          onsubmit="return confirm('Are you sure you want to delete this student?');">
                                        <button type="submit" class="text-red-600 hover:text-red-900">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
