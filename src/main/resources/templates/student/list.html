<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Alerts -->
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center">
                        <i class="fas fa-user-graduate text-emerald-600 text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Students</h1>
                        <p class="text-gray-500">Manage student records</p>
                    </div>
                </div>
                <div class="mt-4 md:mt-0" sec:authorize="hasRole('TEACHER')">
                    <a href="/students/new"
                       class="inline-flex items-center px-5 py-2.5 btn-primary text-white rounded-xl font-medium shadow-lg shadow-primary-500/30">
                        <i class="fas fa-user-plus mr-2"></i> Add Student
                    </a>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="bg-white rounded-2xl border border-gray-100 p-5 mb-6">
                <form method="get" action="/students" class="flex flex-wrap items-end gap-4">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Filter by Department</label>
                        <select name="departmentId"
                                onchange="this.form.submit()"
                                class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
                            <option value="">All Departments</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}"
                                    th:selected="${dept.id == selectedDepartmentId}">Department</option>
                        </select>
                    </div>
                    <a href="/students" class="px-4 py-2.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-xl transition-colors">
                        <i class="fas fa-times mr-1"></i> Clear
                    </a>
                </form>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center py-16 bg-white rounded-2xl border border-gray-100">
                <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-user-graduate text-3xl text-gray-400"></i>
                </div>
                <p class="text-gray-500 text-lg mb-4">No students found</p>
                <a href="/students/new" class="inline-flex items-center text-primary-600 hover:text-primary-700 font-medium" sec:authorize="hasRole('TEACHER')">
                    <i class="fas fa-user-plus mr-2"></i> Add your first student
                </a>
            </div>

            <!-- Students Table -->
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden" th:unless="${#lists.isEmpty(students)}">
                <table class="min-w-full">
                    <thead class="bg-gray-50/50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Student</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Roll Number</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Department</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-4 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr th:each="student : ${students}" class="hover:bg-gray-50/50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex items-center">
                                    <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center">
                                        <i class="fas fa-user text-emerald-600"></i>
                                    </div>
                                    <div class="ml-4">
                                        <div class="text-sm font-semibold text-gray-900" th:text="${student.name}">Name</div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-3 py-1 text-xs font-medium bg-gray-100 text-gray-700 rounded-lg" th:text="${student.roll}">Roll</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="text-sm text-gray-600" th:text="${student.departmentName ?: 'Unassigned'}">Department</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${student.email}">Email</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right">
                                <div class="flex items-center justify-end space-x-2">
                                    <a th:href="@{/students/{id}(id=${student.id})}" class="p-2 text-gray-400 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition-colors" title="View">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <span sec:authorize="hasRole('TEACHER')">
                                        <a th:href="@{/students/{id}/edit(id=${student.id})}" class="p-2 text-gray-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors" title="Edit">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="inline"
                                              onsubmit="return confirm('Are you sure you want to delete this student?');">
                                            <button type="submit" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
