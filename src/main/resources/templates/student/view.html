<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Student Details')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Back Button -->
            <a href="/students" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-6">
                <i class="fas fa-arrow-left mr-2"></i> Back to Students
            </a>

            <!-- Student Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="gradient-bg px-6 py-8">
                    <div class="flex items-center">
                        <div class="h-20 w-20 rounded-full bg-white/20 flex items-center justify-center">
                            <i class="fas fa-user-graduate text-white text-3xl"></i>
                        </div>
                        <div class="ml-6">
                            <h1 class="text-2xl font-bold text-white" th:text="${student.name}">Student Name</h1>
                            <p class="text-white/70">
                                <span class="px-2 py-1 bg-white/20 rounded text-sm" th:text="${student.roll}">Roll</span>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="p-6">
                    <!-- Info Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-2">Email</h3>
                            <p class="text-gray-900 flex items-center">
                                <i class="fas fa-envelope text-gray-400 mr-2"></i>
                                <span th:text="${student.email}">email@example.com</span>
                            </p>
                        </div>
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-2">Department</h3>
                            <p class="text-gray-900 flex items-center">
                                <i class="fas fa-building text-gray-400 mr-2"></i>
                                <span th:text="${student.departmentName ?: 'Not Assigned'}">Department</span>
                            </p>
                        </div>
                    </div>

                    <!-- Enrolled Courses -->
                    <div class="border-t pt-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">
                            <i class="fas fa-book text-blue-500 mr-2"></i> Enrolled Courses
                        </h3>
                        <div th:if="${student.courseIds == null || student.courseIds.isEmpty()}" class="text-gray-500 text-center py-4">
                            No courses enrolled yet
                        </div>
                        <div class="flex flex-wrap gap-2" th:unless="${student.courseIds == null || student.courseIds.isEmpty()}">
                            <span th:each="course : ${courses}"
                                  th:if="${student.courseIds.contains(course.id)}"
                                  class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm"
                                  th:text="${course.name}">Course</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex space-x-4 pt-6 border-t mt-6">
                        <!-- Teachers can edit any student -->
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           sec:authorize="hasRole('TEACHER')"
                           class="flex-1 text-center px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                            <i class="fas fa-edit mr-2"></i> Edit Student
                        </a>
                        <!-- Students can only edit themselves -->
                        <a th:if="${user.id == student.id}"
                           th:href="@{/students/{id}/edit(id=${student.id})}"
                           sec:authorize="hasRole('STUDENT')"
                           class="flex-1 text-center px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                            <i class="fas fa-edit mr-2"></i> Edit Profile
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="flex-1"
                              sec:authorize="hasRole('TEACHER')"
                              onsubmit="return confirm('Are you sure you want to delete this student?');">
                            <button type="submit" class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                                <i class="fas fa-trash mr-2"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
