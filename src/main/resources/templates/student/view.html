<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Student Details')}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Back Button -->
            <a href="/students" class="inline-flex items-center text-gray-500 hover:text-gray-700 mb-6 font-medium">
                <i class="fas fa-arrow-left mr-2"></i> Back to Students
            </a>

            <!-- Student Card -->
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                <!-- Header -->
                <div class="bg-gradient-to-r from-emerald-500 to-teal-500 px-8 py-10">
                    <div class="flex items-center">
                        <div class="w-20 h-20 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center">
                            <i class="fas fa-user-graduate text-white text-3xl"></i>
                        </div>
                        <div class="ml-6">
                            <h1 class="text-2xl font-bold text-white" th:text="${student.name}">Student Name</h1>
                            <span class="inline-flex items-center px-3 py-1 mt-2 bg-white/20 backdrop-blur rounded-lg text-white text-sm font-medium" th:text="${student.roll}">Roll</span>
                        </div>
                    </div>
                </div>

                <div class="p-8">
                    <!-- Info Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                        <div class="flex items-start space-x-4">
                            <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-envelope text-gray-500"></i>
                            </div>
                            <div>
                                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Email</h3>
                                <p class="text-gray-900 font-medium" th:text="${student.email}">email@example.com</p>
                            </div>
                        </div>
                        <div class="flex items-start space-x-4">
                            <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-building text-gray-500"></i>
                            </div>
                            <div>
                                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">Department</h3>
                                <p class="text-gray-900 font-medium" th:text="${student.departmentName ?: 'Not Assigned'}">Department</p>
                            </div>
                        </div>
                    </div>

                    <!-- Enrolled Courses -->
                    <div class="border-t border-gray-100 pt-8">
                        <h3 class="flex items-center text-lg font-bold text-gray-900 mb-4">
                            <div class="w-8 h-8 rounded-lg bg-sky-100 flex items-center justify-center mr-3">
                                <i class="fas fa-book text-sky-600 text-sm"></i>
                            </div>
                            Enrolled Courses
                        </h3>
                        <div th:if="${student.courseIds == null || student.courseIds.isEmpty()}" class="text-gray-400 text-center py-6 bg-gray-50 rounded-xl">
                            No courses enrolled yet
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3" th:unless="${student.courseIds == null || student.courseIds.isEmpty()}">
                            <div th:each="course : ${courses}"
                                  th:if="${student.courseIds.contains(course.id)}"
                                  class="flex items-center justify-between px-4 py-3 bg-sky-50 text-sky-700 rounded-xl border border-sky-100">
                                <div class="flex items-center">
                                    <i class="fas fa-book-open mr-3 text-sky-600"></i>
                                    <div>
                                        <p class="font-medium" th:text="${course.name}">Course</p>
                                        <p class="text-xs text-sky-600" th:text="${course.departmentName}">Department</p>
                                    </div>
                                </div>
                                <!-- Drop button: visible to the student themselves or teachers -->
                                <form th:if="${user.teacher || user.id == student.id}"
                                      th:action="@{/students/{studentId}/courses/{courseId}/drop(studentId=${student.id},courseId=${course.id})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to drop this course?');">
                                    <button type="submit" class="p-2 text-red-500 hover:text-red-700 hover:bg-red-100 rounded-lg transition-colors" title="Drop Course">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Available Courses to Enroll -->
                    <div th:if="${user.teacher || user.id == student.id}" class="border-t border-gray-100 pt-8 mt-8">
                        <h3 class="flex items-center text-lg font-bold text-gray-900 mb-4">
                            <div class="w-8 h-8 rounded-lg bg-emerald-100 flex items-center justify-center mr-3">
                                <i class="fas fa-plus-circle text-emerald-600 text-sm"></i>
                            </div>
                            Available Courses
                        </h3>
                        <div th:if="${availableCourses == null || availableCourses.isEmpty()}" class="text-gray-400 text-center py-6 bg-gray-50 rounded-xl">
                            No available courses to enroll
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3" th:unless="${availableCourses == null || availableCourses.isEmpty()}">
                            <div th:each="course : ${availableCourses}"
                                  class="flex items-center justify-between px-4 py-3 bg-gray-50 hover:bg-emerald-50 rounded-xl border border-gray-200 hover:border-emerald-200 transition-all">
                                <div class="flex items-center">
                                    <i class="fas fa-book mr-3 text-gray-400"></i>
                                    <div>
                                        <p class="font-medium text-gray-700" th:text="${course.name}">Course</p>
                                        <p class="text-xs text-gray-500" th:text="${course.departmentName}">Department</p>
                                    </div>
                                </div>
                                <form th:action="@{/students/{studentId}/courses/{courseId}/enroll(studentId=${student.id},courseId=${course.id})}"
                                      method="post">
                                    <button type="submit" class="p-2 text-emerald-500 hover:text-emerald-700 hover:bg-emerald-100 rounded-lg transition-colors" title="Enroll in Course">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex flex-col sm:flex-row gap-4 pt-8 border-t border-gray-100 mt-8">
                        <!-- Teachers can edit any student -->
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           sec:authorize="hasRole('TEACHER')"
                           class="flex-1 text-center px-6 py-3 btn-primary text-white rounded-xl font-medium shadow-lg shadow-primary-500/30">
                            <i class="fas fa-edit mr-2"></i> Edit Student
                        </a>
                        <!-- Students can only edit themselves -->
                        <a th:if="${user.id == student.id}"
                           th:href="@{/students/{id}/edit(id=${student.id})}"
                           sec:authorize="hasRole('STUDENT')"
                           class="flex-1 text-center px-6 py-3 btn-primary text-white rounded-xl font-medium shadow-lg shadow-primary-500/30">
                            <i class="fas fa-edit mr-2"></i> Edit Profile
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="flex-1"
                              sec:authorize="hasRole('TEACHER')"
                              onsubmit="return confirm('Are you sure you want to delete this student?');">
                            <button type="submit" class="w-full px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-medium transition-colors">
                                <i class="fas fa-trash mr-2"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
