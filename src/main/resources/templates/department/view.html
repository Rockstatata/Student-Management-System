<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Department Details')}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Back Button -->
            <a href="/departments" class="inline-flex items-center text-gray-500 hover:text-gray-700 mb-6 font-medium">
                <i class="fas fa-arrow-left mr-2"></i> Back to Departments
            </a>

            <!-- Department Card -->
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                <!-- Header -->
                <div class="bg-gradient-to-r from-violet-500 to-purple-500 px-8 py-10">
                    <div class="flex items-center">
                        <div class="w-20 h-20 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center">
                            <i class="fas fa-building text-white text-3xl"></i>
                        </div>
                        <div class="ml-6">
                            <h1 class="text-2xl font-bold text-white" th:text="${department.name}">Department Name</h1>
                            <p class="text-white/70 mt-1">Department</p>
                        </div>
                    </div>
                </div>

                <div class="p-8">
                    <!-- Description -->
                    <div class="mb-8">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Description</h3>
                        <p class="text-gray-700" th:text="${department.description ?: 'No description available'}">
                            Description text
                        </p>
                    </div>

                    <!-- Stats -->
                    <div class="grid grid-cols-3 gap-4 mb-8">
                        <div class="text-center p-5 bg-amber-50 rounded-2xl border border-amber-100">
                            <p class="text-3xl font-bold text-amber-600" th:text="${department.teacherCount}">0</p>
                            <p class="text-sm text-amber-700 mt-1 font-medium">Teachers</p>
                        </div>
                        <div class="text-center p-5 bg-emerald-50 rounded-2xl border border-emerald-100">
                            <p class="text-3xl font-bold text-emerald-600" th:text="${department.studentCount}">0</p>
                            <p class="text-sm text-emerald-700 mt-1 font-medium">Students</p>
                        </div>
                        <div class="text-center p-5 bg-sky-50 rounded-2xl border border-sky-100">
                            <p class="text-3xl font-bold text-sky-600" th:text="${department.courseCount}">0</p>
                            <p class="text-sm text-sky-700 mt-1 font-medium">Courses</p>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-100" sec:authorize="hasRole('TEACHER')">
                        <a th:href="@{/departments/{id}/edit(id=${department.id})}"
                           class="flex-1 text-center px-6 py-3 btn-primary text-white rounded-xl font-medium shadow-lg shadow-primary-500/30">
                            <i class="fas fa-edit mr-2"></i> Edit Department
                        </a>
                        <form th:action="@{/departments/{id}/delete(id=${department.id})}" method="post" class="flex-1"
                              onsubmit="return confirm('Are you sure you want to delete this department?');">
                            <button type="submit" class="w-full px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-medium transition-colors">
                                <i class="fas fa-trash mr-2"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Quick Links -->
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <a th:href="@{/courses(departmentId=${department.id})}"
                   class="group flex items-center p-5 bg-white rounded-2xl border border-gray-100 hover:border-primary-200 hover:shadow-lg hover:shadow-primary-500/10 transition-all">
                    <div class="w-12 h-12 rounded-xl bg-sky-100 group-hover:bg-sky-200 flex items-center justify-center mr-4 transition-colors">
                        <i class="fas fa-book text-sky-600"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-900">View Courses</p>
                        <p class="text-sm text-gray-500">Browse courses in this department</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 group-hover:text-primary-500 transition-colors"></i>
                </a>
                <a th:href="@{/students(departmentId=${department.id})}"
                   class="group flex items-center p-5 bg-white rounded-2xl border border-gray-100 hover:border-primary-200 hover:shadow-lg hover:shadow-primary-500/10 transition-all">
                    <div class="w-12 h-12 rounded-xl bg-emerald-100 group-hover:bg-emerald-200 flex items-center justify-center mr-4 transition-colors">
                        <i class="fas fa-user-graduate text-emerald-600"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold text-gray-900">View Students</p>
                        <p class="text-sm text-gray-500">Browse students in this department</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 group-hover:text-primary-500 transition-colors"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
