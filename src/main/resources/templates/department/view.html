<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Department Details')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Back Button -->
            <a href="/departments" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-6">
                <i class="fas fa-arrow-left mr-2"></i> Back to Departments
            </a>

            <!-- Department Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="gradient-bg px-6 py-8">
                    <div class="flex items-center">
                        <div class="p-4 rounded-full bg-white/20">
                            <i class="fas fa-building text-white text-2xl"></i>
                        </div>
                        <div class="ml-4">
                            <h1 class="text-2xl font-bold text-white" th:text="${department.name}">Department Name</h1>
                            <p class="text-white/70">Department</p>
                        </div>
                    </div>
                </div>

                <div class="p-6">
                    <!-- Description -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-2">Description</h3>
                        <p class="text-gray-700" th:text="${department.description ?: 'No description available'}">
                            Description text
                        </p>
                    </div>

                    <!-- Stats -->
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="text-center p-4 bg-yellow-50 rounded-lg">
                            <p class="text-2xl font-bold text-yellow-700" th:text="${department.teacherCount}">0</p>
                            <p class="text-sm text-yellow-600">Teachers</p>
                        </div>
                        <div class="text-center p-4 bg-green-50 rounded-lg">
                            <p class="text-2xl font-bold text-green-700" th:text="${department.studentCount}">0</p>
                            <p class="text-sm text-green-600">Students</p>
                        </div>
                        <div class="text-center p-4 bg-blue-50 rounded-lg">
                            <p class="text-2xl font-bold text-blue-700" th:text="${department.courseCount}">0</p>
                            <p class="text-sm text-blue-600">Courses</p>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex space-x-4 pt-4 border-t" sec:authorize="hasRole('TEACHER')">
                        <a th:href="@{/departments/{id}/edit(id=${department.id})}"
                           class="flex-1 text-center px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                            <i class="fas fa-edit mr-2"></i> Edit Department
                        </a>
                        <form th:action="@{/departments/{id}/delete(id=${department.id})}" method="post" class="flex-1"
                              onsubmit="return confirm('Are you sure you want to delete this department?');">
                            <button type="submit" class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                                <i class="fas fa-trash mr-2"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Quick Links -->
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <a th:href="@{/courses(departmentId=${department.id})}"
                   class="flex items-center p-4 bg-white rounded-lg shadow-sm border hover:shadow-md transition-shadow">
                    <div class="p-3 rounded-full bg-blue-100 mr-4">
                        <i class="fas fa-book text-blue-600"></i>
                    </div>
                    <div>
                        <p class="font-medium text-gray-900">View Courses</p>
                        <p class="text-sm text-gray-500">Browse courses in this department</p>
                    </div>
                    <i class="fas fa-chevron-right ml-auto text-gray-400"></i>
                </a>
                <a th:href="@{/students(departmentId=${department.id})}"
                   class="flex items-center p-4 bg-white rounded-lg shadow-sm border hover:shadow-md transition-shadow">
                    <div class="p-3 rounded-full bg-green-100 mr-4">
                        <i class="fas fa-user-graduate text-green-600"></i>
                    </div>
                    <div>
                        <p class="font-medium text-gray-900">View Students</p>
                        <p class="text-sm text-gray-500">Browse students in this department</p>
                    </div>
                    <i class="fas fa-chevron-right ml-auto text-gray-400"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
