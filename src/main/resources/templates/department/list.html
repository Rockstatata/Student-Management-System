<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Departments')}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Alerts -->
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-violet-100 flex items-center justify-center">
                        <i class="fas fa-building text-violet-600 text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Departments</h1>
                        <p class="text-gray-500">Manage all academic departments</p>
                    </div>
                </div>
                <div class="mt-4 md:mt-0" sec:authorize="hasRole('TEACHER')">
                    <a href="/departments/new"
                       class="inline-flex items-center px-5 py-2.5 btn-primary text-white rounded-xl font-medium shadow-lg shadow-primary-500/30">
                        <i class="fas fa-plus mr-2"></i> Add Department
                    </a>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(departments)}" class="text-center py-16 bg-white rounded-2xl border border-gray-100">
                <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-building text-3xl text-gray-400"></i>
                </div>
                <p class="text-gray-500 text-lg mb-4">No departments found</p>
                <a href="/departments/new" class="inline-flex items-center text-primary-600 hover:text-primary-700 font-medium" sec:authorize="hasRole('TEACHER')">
                    <i class="fas fa-plus mr-2"></i> Create your first department
                </a>
            </div>

            <!-- Departments Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" th:unless="${#lists.isEmpty(departments)}">
                <div th:each="dept : ${departments}"
                     class="bg-white rounded-2xl border border-gray-100 overflow-hidden card-hover">
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center">
                                <div class="w-12 h-12 rounded-xl bg-violet-100 flex items-center justify-center">
                                    <i class="fas fa-building text-violet-600"></i>
                                </div>
                                <div class="ml-4">
                                    <h3 class="text-lg font-bold text-gray-900" th:text="${dept.name}">Department Name</h3>
                                </div>
                            </div>
                        </div>
                        <p class="text-gray-500 text-sm line-clamp-2 mb-4" th:text="${dept.description ?: 'No description available'}">
                            Description
                        </p>
                        <div class="flex items-center space-x-4 text-sm">
                            <span class="flex items-center text-amber-600 bg-amber-50 px-3 py-1 rounded-lg">
                                <i class="fas fa-chalkboard-teacher mr-1.5 text-xs"></i>
                                <span th:text="${dept.teacherCount}">0</span>
                            </span>
                            <span class="flex items-center text-emerald-600 bg-emerald-50 px-3 py-1 rounded-lg">
                                <i class="fas fa-user-graduate mr-1.5 text-xs"></i>
                                <span th:text="${dept.studentCount}">0</span>
                            </span>
                            <span class="flex items-center text-sky-600 bg-sky-50 px-3 py-1 rounded-lg">
                                <i class="fas fa-book mr-1.5 text-xs"></i>
                                <span th:text="${dept.courseCount}">0</span>
                            </span>
                        </div>
                    </div>
                    <div class="px-6 py-4 bg-gray-50/50 border-t border-gray-100 flex justify-between items-center">
                        <a th:href="@{/departments/{id}(id=${dept.id})}"
                           class="text-primary-600 hover:text-primary-700 text-sm font-medium">
                            View Details <i class="fas fa-arrow-right ml-1"></i>
                        </a>
                        <div class="flex space-x-1" sec:authorize="hasRole('TEACHER')">
                            <a th:href="@{/departments/{id}/edit(id=${dept.id})}"
                               class="p-2 text-gray-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/departments/{id}/delete(id=${dept.id})}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this department?');">
                                <button type="submit" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
