<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${department.id != null ? 'Edit Department' : 'New Department'})}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Back Button -->
            <a href="/departments" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-6">
                <i class="fas fa-arrow-left mr-2"></i> Back to Departments
            </a>

            <!-- Form Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="gradient-bg px-6 py-6">
                    <h1 class="text-xl font-bold text-white">
                        <i class="fas fa-building mr-2"></i>
                        <span th:text="${department.id != null ? 'Edit Department' : 'Create New Department'}">Department Form</span>
                    </h1>
                </div>

                <div class="p-6">
                    <!-- Error Message -->
                    <div th:if="${errorMessage}" class="bg-red-50 border-l-4 border-red-400 p-4 rounded-r-lg mb-6">
                        <div class="flex items-center">
                            <i class="fas fa-exclamation-circle text-red-400 mr-3"></i>
                            <p class="text-red-700" th:text="${errorMessage}">Error</p>
                        </div>
                    </div>

                    <form th:action="${department.id != null ? '/departments/' + department.id + '/edit' : '/departments/new'}"
                          th:object="${department}"
                          method="post"
                          class="space-y-6">

                        <!-- Name Field -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-tag text-gray-400 mr-1"></i> Department Name *
                            </label>
                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                   th:classappend="${#fields.hasErrors('name')} ? 'border-red-500' : ''"
                                   placeholder="e.g., Computer Science">
                            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-red-600"></p>
                        </div>

                        <!-- Description Field -->
                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-align-left text-gray-400 mr-1"></i> Description
                            </label>
                            <textarea id="description"
                                      th:field="*{description}"
                                      rows="4"
                                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                      th:classappend="${#fields.hasErrors('description')} ? 'border-red-500' : ''"
                                      placeholder="Brief description of the department..."></textarea>
                            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-1 text-sm text-red-600"></p>
                        </div>

                        <!-- Submit Button -->
                        <div class="flex space-x-4 pt-4">
                            <button type="submit"
                                    class="flex-1 gradient-bg text-white py-3 px-4 rounded-lg font-medium hover:opacity-90 transition-opacity shadow-lg">
                                <i class="fas fa-save mr-2"></i>
                                <span th:text="${department.id != null ? 'Update Department' : 'Create Department'}">Save</span>
                            </button>
                            <a href="/departments"
                               class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
