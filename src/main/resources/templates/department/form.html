<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${department.id != null ? 'Edit Department' : 'New Department'})}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Back Button -->
            <a href="/departments" class="inline-flex items-center text-gray-500 hover:text-gray-700 mb-6 font-medium">
                <i class="fas fa-arrow-left mr-2"></i> Back to Departments
            </a>

            <!-- Form Card -->
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                <!-- Header -->
                <div class="bg-gradient-to-r from-violet-500 to-purple-500 px-8 py-6">
                    <div class="flex items-center">
                        <div class="w-12 h-12 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center">
                            <i class="fas fa-building text-white text-xl"></i>
                        </div>
                        <h1 class="ml-4 text-xl font-bold text-white" th:text="${department.id != null ? 'Edit Department' : 'Create New Department'}">Department Form</h1>
                    </div>
                </div>

                <div class="p-8">
                    <!-- Error Message -->
                    <div th:if="${errorMessage}" class="bg-red-50 border border-red-100 p-4 rounded-xl mb-6 flex items-center">
                        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center mr-4 flex-shrink-0">
                            <i class="fas fa-exclamation text-red-500"></i>
                        </div>
                        <p class="text-red-700 text-sm font-medium" th:text="${errorMessage}">Error</p>
                    </div>

                    <form th:action="${department.id != null ? '/departments/' + department.id + '/edit' : '/departments/new'}"
                          th:object="${department}"
                          method="post"
                          class="space-y-6">

                        <!-- Name Field -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Department Name *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fas fa-tag text-gray-400"></i>
                                </div>
                                <input type="text"
                                       id="name"
                                       th:field="*{name}"
                                       class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all input-field"
                                       th:classappend="${#fields.hasErrors('name')} ? 'border-red-500' : ''"
                                       placeholder="e.g., Computer Science">
                            </div>
                            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-red-600"></p>
                        </div>

                        <!-- Description Field -->
                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                            <textarea id="description"
                                      th:field="*{description}"
                                      rows="4"
                                      class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all input-field"
                                      th:classappend="${#fields.hasErrors('description')} ? 'border-red-500' : ''"
                                      placeholder="Brief description of the department..."></textarea>
                            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-1 text-sm text-red-600"></p>
                        </div>

                        <!-- Submit Button -->
                        <div class="flex space-x-4 pt-4">
                            <button type="submit"
                                    class="flex-1 btn-primary text-white py-3.5 px-4 rounded-xl font-semibold shadow-lg shadow-primary-500/30">
                                <i class="fas fa-save mr-2"></i>
                                <span th:text="${department.id != null ? 'Update Department' : 'Create Department'}">Save</span>
                            </button>
                            <a href="/departments"
                               class="px-6 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-medium transition-colors text-center">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
