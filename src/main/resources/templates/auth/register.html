<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="min-h-screen gradient-bg flex items-center justify-center py-8">
    <div class="w-full max-w-2xl">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-lg mb-4">
                <i class="fas fa-user-plus text-4xl text-primary-600"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">Create Account</h1>
            <p class="text-white/70 mt-2">Join Student Management System</p>
        </div>

        <!-- Registration Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <!-- Error Alert -->
            <div th:if="${error}" class="bg-red-50 border-l-4 border-red-400 p-4 rounded-r-lg mb-6">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-400 mr-3"></i>
                    <p class="text-red-700" th:text="${error}">Error message</p>
                </div>
            </div>

            <form th:action="@{/register}" method="post" th:object="${registrationDto}" class="space-y-6">
                <!-- User Type Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">
                        <i class="fas fa-user-tag text-gray-400 mr-1"></i> Register As
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center justify-center p-4 border-2 rounded-lg cursor-pointer transition-all hover:border-primary-500 user-type-option">
                            <input type="radio"
                                   th:field="*{userType}"
                                   value="STUDENT"
                                   class="sr-only"
                                   onchange="toggleUserTypeFields()"
                                   required>
                            <div class="text-center">
                                <i class="fas fa-user-graduate text-3xl mb-2 text-green-600"></i>
                                <p class="font-medium text-gray-700">Student</p>
                            </div>
                        </label>
                        <label class="relative flex items-center justify-center p-4 border-2 rounded-lg cursor-pointer transition-all hover:border-primary-500 user-type-option">
                            <input type="radio"
                                   th:field="*{userType}"
                                   value="TEACHER"
                                   class="sr-only"
                                   onchange="toggleUserTypeFields()"
                                   required>
                            <div class="text-center">
                                <i class="fas fa-chalkboard-teacher text-3xl mb-2 text-yellow-600"></i>
                                <p class="font-medium text-gray-700">Teacher</p>
                            </div>
                        </label>
                    </div>
                    <p th:if="${#fields.hasErrors('userType')}"
                       th:errors="*{userType}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user text-gray-400 mr-1"></i> Full Name
                    </label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                           placeholder="Enter your full name">
                    <p th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-envelope text-gray-400 mr-1"></i> Email Address
                    </label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                           placeholder="Enter your email">
                    <p th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- Roll Number (Students Only) -->
                <div id="rollField" style="display:none;">
                    <label for="roll" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-id-card text-gray-400 mr-1"></i> Roll Number
                    </label>
                    <input type="text"
                           id="roll"
                           th:field="*{roll}"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                           placeholder="Enter your roll number">
                    <p th:if="${#fields.hasErrors('roll')}"
                       th:errors="*{roll}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- Department Field -->
                <div>
                    <label for="departmentId" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-building text-gray-400 mr-1"></i> Department (Optional)
                    </label>
                    <select id="departmentId"
                            th:field="*{departmentId}"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
                        <option value="">Select Department</option>
                        <option th:each="dept : ${departments}"
                                th:value="${dept.id}"
                                th:text="${dept.name}">Department</option>
                    </select>
                </div>

                <!-- Password Fields Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock text-gray-400 mr-1"></i> Password
                        </label>
                        <input type="password"
                               id="password"
                               th:field="*{password}"
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                               placeholder="Min. 6 characters">
                        <p th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}"
                           class="mt-1 text-sm text-red-600"></p>
                    </div>

                    <!-- Confirm Password Field -->
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock text-gray-400 mr-1"></i> Confirm Password
                        </label>
                        <input type="password"
                               id="confirmPassword"
                               th:field="*{confirmPassword}"
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                               placeholder="Confirm password">
                        <p th:if="${#fields.hasErrors('confirmPassword')}"
                           th:errors="*{confirmPassword}"
                           class="mt-1 text-sm text-red-600"></p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full gradient-bg text-white py-3 px-4 rounded-lg font-medium hover:opacity-90 transition-opacity shadow-lg">
                    <i class="fas fa-user-plus mr-2"></i> Create Account
                </button>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    Already have an account?
                    <a href="/login" class="text-primary-600 font-medium hover:text-primary-700 transition-colors">
                        Sign in here
                    </a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-white/60 text-sm mt-8">
            © 2026 Student Management System
        </p>
    </div>

    <script>
        function toggleUserTypeFields() {
            const studentRadio = document.querySelector('input[name="userType"][value="STUDENT"]');
            const rollField = document.getElementById('rollField');
            const rollInput = document.getElementById('roll');

            if (studentRadio && studentRadio.checked) {
                rollField.style.display = 'block';
                rollInput.required = true;
            } else {
                rollField.style.display = 'none';
                rollInput.required = false;
                rollInput.value = '';
            }

            // Update active state for user type options
            document.querySelectorAll('.user-type-option').forEach(label => {
                const input = label.querySelector('input[type="radio"]');
                if (input.checked) {
                    label.classList.add('border-primary-500', 'bg-primary-50');
                    label.classList.remove('border-gray-300');
                } else {
                    label.classList.remove('border-primary-500', 'bg-primary-50');
                    label.classList.add('border-gray-300');
                }
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            toggleUserTypeFields();
        });
    </script>

    <style>
        .user-type-option input:checked ~ div {
            color: #4f46e5;
        }
    </style>
</body>
</html>
