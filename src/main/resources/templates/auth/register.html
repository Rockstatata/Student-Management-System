<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-xl">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-500 rounded-2xl shadow-lg shadow-primary-500/30 mb-6">
                <i class="fas fa-user-plus text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Create an account</h1>
            <p class="text-gray-500 mt-2">Join the Student Management System</p>
        </div>

        <!-- Registration Card -->
        <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 p-8 border border-gray-100">
            <!-- Error Alert -->
            <div th:if="${error}" class="bg-red-50 border border-red-100 p-4 rounded-xl mb-6 flex items-center">
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center mr-4 flex-shrink-0">
                    <i class="fas fa-exclamation text-red-500"></i>
                </div>
                <p class="text-red-700 text-sm font-medium" th:text="${error}">Error message</p>
            </div>

            <form th:action="@{/register}" method="post" th:object="${registrationDto}" class="space-y-6">
                <!-- User Type Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">Register As</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="relative flex items-center justify-center p-5 border-2 border-gray-200 rounded-xl cursor-pointer transition-all hover:border-primary-300 hover:bg-primary-50/50 user-type-option">
                            <input type="radio"
                                   th:field="*{userType}"
                                   value="STUDENT"
                                   class="sr-only"
                                   onchange="toggleUserTypeFields()"
                                   required>
                            <div class="text-center">
                                <div class="w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center mx-auto mb-3">
                                    <i class="fas fa-user-graduate text-xl text-emerald-600"></i>
                                </div>
                                <p class="font-semibold text-gray-700">Student</p>
                            </div>
                        </label>
                        <label class="relative flex items-center justify-center p-5 border-2 border-gray-200 rounded-xl cursor-pointer transition-all hover:border-primary-300 hover:bg-primary-50/50 user-type-option">
                            <input type="radio"
                                   th:field="*{userType}"
                                   value="TEACHER"
                                   class="sr-only"
                                   onchange="toggleUserTypeFields()"
                                   required>
                            <div class="text-center">
                                <div class="w-12 h-12 rounded-xl bg-amber-100 flex items-center justify-center mx-auto mb-3">
                                    <i class="fas fa-chalkboard-teacher text-xl text-amber-600"></i>
                                </div>
                                <p class="font-semibold text-gray-700">Teacher</p>
                            </div>
                        </label>
                    </div>
                    <p th:if="${#fields.hasErrors('userType')}"
                       th:errors="*{userType}"
                       class="mt-2 text-sm text-red-600"></p>
                </div>

                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               required
                               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all input-field"
                               placeholder="Enter your full name">
                    </div>
                    <p th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               required
                               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all input-field"
                               placeholder="Enter your email">
                    </div>
                    <p th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- Roll Number (Students Only) -->
                <div id="rollField" style="display:none;">
                    <label for="roll" class="block text-sm font-medium text-gray-700 mb-2">Roll Number</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-id-card text-gray-400"></i>
                        </div>
                        <input type="text"
                               id="roll"
                               th:field="*{roll}"
                               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all input-field"
                               placeholder="Enter your roll number">
                    </div>
                    <p th:if="${#fields.hasErrors('roll')}"
                       th:errors="*{roll}"
                       class="mt-1 text-sm text-red-600"></p>
                </div>

                <!-- Department Field -->
                <div>
                    <label for="departmentId" class="block text-sm font-medium text-gray-700 mb-2">Department (Optional)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-building text-gray-400"></i>
                        </div>
                        <select id="departmentId"
                                th:field="*{departmentId}"
                                class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all input-field appearance-none">
                            <option value="">Select Department</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}">Department</option>
                        </select>
                    </div>
                </div>

                <!-- Password Fields Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password"
                                   id="password"
                                   th:field="*{password}"
                                   required
                                   class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all input-field"
                                   placeholder="Min. 6 characters">
                        </div>
                        <p th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}"
                           class="mt-1 text-sm text-red-600"></p>
                    </div>

                    <!-- Confirm Password Field -->
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password"
                                   id="confirmPassword"
                                   th:field="*{confirmPassword}"
                                   required
                                   class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 focus:bg-white transition-all input-field"
                                   placeholder="Confirm password">
                        </div>
                        <p th:if="${#fields.hasErrors('confirmPassword')}"
                           th:errors="*{confirmPassword}"
                           class="mt-1 text-sm text-red-600"></p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full btn-primary text-white py-3.5 px-4 rounded-xl font-semibold shadow-lg shadow-primary-500/30">
                    <i class="fas fa-user-plus mr-2"></i> Create Account
                </button>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    Already have an account?
                    <a href="/login" class="text-primary-600 font-semibold hover:text-primary-700 transition-colors ml-1">
                        Sign in
                    </a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-gray-400 text-sm mt-8">
            © 2026 Student Management System
        </p>
    </div>

    <script>
        function toggleUserTypeFields() {
            const studentRadio = document.querySelector('input[name="userType"][value="STUDENT"]');
            const rollField = document.getElementById('rollField');
            const rollInput = document.getElementById('roll');

            if (studentRadio && studentRadio.checked) {
                rollField.style.display = 'block';
                rollInput.required = true;
            } else {
                rollField.style.display = 'none';
                rollInput.required = false;
                rollInput.value = '';
            }

            // Update active state for user type options
            document.querySelectorAll('.user-type-option').forEach(label => {
                const input = label.querySelector('input[type="radio"]');
                if (input.checked) {
                    label.classList.add('border-primary-500', 'bg-primary-50');
                    label.classList.remove('border-gray-200');
                } else {
                    label.classList.remove('border-primary-500', 'bg-primary-50');
                    label.classList.add('border-gray-200');
                }
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            toggleUserTypeFields();
        });
    </script>
</body>
</html>
