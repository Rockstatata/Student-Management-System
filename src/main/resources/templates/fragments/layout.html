<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SMS'">Student Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        accent: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        .card-hover {
            transition: all 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(59, 130, 246, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .input-field {
            transition: all 0.2s ease;
        }
        .input-field:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .nav-link {
            position: relative;
            transition: all 0.2s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #3b82f6;
            transition: width 0.2s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="/dashboard" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-primary-500 flex items-center justify-center">
                        <i class="fas fa-graduation-cap text-white text-lg"></i>
                    </div>
                    <span class="text-gray-900 font-bold text-xl">StudentMS</span>
                </a>
            </div>
            <div class="flex items-center space-x-1">
                <div class="hidden md:flex items-center space-x-1">
                    <a href="/dashboard" class="nav-link px-4 py-2 text-gray-600 hover:text-primary-600 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fas fa-home mr-2"></i>Dashboard
                    </a>
                    <a href="/departments" class="nav-link px-4 py-2 text-gray-600 hover:text-primary-600 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fas fa-building mr-2"></i>Departments
                    </a>
                    <a href="/courses" class="nav-link px-4 py-2 text-gray-600 hover:text-primary-600 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fas fa-book mr-2"></i>Courses
                    </a>
                    <a href="/students" class="nav-link px-4 py-2 text-gray-600 hover:text-primary-600 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fas fa-user-graduate mr-2"></i>Students
                    </a>
                    <a href="/teachers" class="nav-link px-4 py-2 text-gray-600 hover:text-primary-600 font-medium rounded-lg hover:bg-gray-50 transition-colors">
                        <i class="fas fa-chalkboard-teacher mr-2"></i>Teachers
                    </a>
                </div>
                <div class="flex items-center ml-6 pl-6 border-l border-gray-200">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-full bg-primary-100 flex items-center justify-center">
                            <i class="fas fa-user text-primary-600 text-sm"></i>
                        </div>
                        <div class="hidden sm:block">
                            <p class="text-sm font-semibold text-gray-900" th:text="${user?.name ?: 'User'}">User</p>
                            <p class="text-xs text-gray-500" th:text="${user?.teacher ? 'Teacher' : 'Student'}">Role</p>
                        </div>
                    </div>
                    <form th:action="@{/logout}" method="post" class="ml-4">
                        <button type="submit" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Logout">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Alert Messages Fragment -->
<div th:fragment="alerts" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
    <div th:if="${successMessage}" class="bg-green-50 border border-green-200 p-4 rounded-xl mb-4 flex items-center">
        <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center mr-4">
            <i class="fas fa-check text-green-600"></i>
        </div>
        <p class="text-green-800 font-medium" th:text="${successMessage}">Success message</p>
    </div>
    <div th:if="${errorMessage}" class="bg-red-50 border border-red-200 p-4 rounded-xl mb-4 flex items-center">
        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center mr-4">
            <i class="fas fa-exclamation text-red-600"></i>
        </div>
        <p class="text-red-800 font-medium" th:text="${errorMessage}">Error message</p>
    </div>
</div>

<!-- Page Header Fragment -->
<div th:fragment="page-header(title, subtitle)" class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900" th:text="${title}">Page Title</h1>
    <p class="mt-2 text-gray-500" th:text="${subtitle}">Page subtitle</p>
</div>

<!-- Empty State Fragment -->
<div th:fragment="empty-state(message, icon)" class="text-center py-16">
    <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-6">
        <i th:class="${icon} + ' text-3xl text-gray-400'"></i>
    </div>
    <p class="text-gray-500 text-lg" th:text="${message}">No items found</p>
</div>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="bg-white border-t border-gray-100 mt-auto">
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-4 md:mb-0">
                <div class="w-8 h-8 rounded-lg bg-primary-500 flex items-center justify-center">
                    <i class="fas fa-graduation-cap text-white text-sm"></i>
                </div>
                <span class="text-gray-700 font-semibold">StudentMS</span>
            </div>
            <p class="text-gray-400 text-sm">
                © 2026 Student Management System. Built with Spring Boot & Thymeleaf.
            </p>
        </div>
    </div>
</footer>

</body>
</html>
