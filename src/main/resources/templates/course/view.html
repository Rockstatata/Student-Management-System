<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Course Details')}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Back Button -->
            <a href="/courses" class="inline-flex items-center text-gray-500 hover:text-gray-700 mb-6 font-medium">
                <i class="fas fa-arrow-left mr-2"></i> Back to Courses
            </a>

            <!-- Course Card -->
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                <!-- Header -->
                <div class="bg-gradient-to-r from-sky-500 to-blue-500 px-8 py-10">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-20 h-20 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center">
                                <i class="fas fa-book text-white text-3xl"></i>
                            </div>
                            <div class="ml-6">
                                <h1 class="text-2xl font-bold text-white" th:text="${course.name}">Course Name</h1>
                                <p class="text-white/70 mt-1" th:text="${course.departmentName}">Department</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-4xl font-bold text-white" th:text="${course.credits ?: 'N/A'}">3</span>
                            <p class="text-white/70">Credits</p>
                        </div>
                    </div>
                </div>

                <div class="p-8">
                    <!-- Description -->
                    <div class="mb-8">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Description</h3>
                        <p class="text-gray-700" th:text="${course.description ?: 'No description available'}">
                            Description text
                        </p>
                    </div>

                    <!-- Stats -->
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="text-center p-5 bg-emerald-50 rounded-2xl border border-emerald-100">
                            <p class="text-3xl font-bold text-emerald-600" th:text="${course.studentCount}">0</p>
                            <p class="text-sm text-emerald-700 mt-1 font-medium">Students Enrolled</p>
                        </div>
                        <div class="text-center p-5 bg-violet-50 rounded-2xl border border-violet-100">
                            <p class="text-lg font-bold text-violet-600" th:text="${course.departmentName}">Dept</p>
                            <p class="text-sm text-violet-700 mt-1 font-medium">Department</p>
                        </div>
                    </div>

                    <!-- Enrolled Students -->
                    <div class="border-t border-gray-100 pt-8 mb-8">
                        <h3 class="flex items-center text-lg font-bold text-gray-900 mb-4">
                            <div class="w-8 h-8 rounded-lg bg-emerald-100 flex items-center justify-center mr-3">
                                <i class="fas fa-user-graduate text-emerald-600 text-sm"></i>
                            </div>
                            Enrolled Students
                        </h3>
                        <div th:if="${enrolledStudents == null || enrolledStudents.isEmpty()}" class="text-gray-400 text-center py-6 bg-gray-50 rounded-xl">
                            No students enrolled yet
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3" th:unless="${enrolledStudents == null || enrolledStudents.isEmpty()}">
                            <div th:each="student : ${enrolledStudents}"
                                  class="flex items-center justify-between px-4 py-3 bg-emerald-50 rounded-xl border border-emerald-100">
                                <div class="flex items-center">
                                    <div class="w-10 h-10 rounded-xl bg-emerald-100 flex items-center justify-center mr-3">
                                        <i class="fas fa-user text-emerald-600"></i>
                                    </div>
                                    <div>
                                        <p class="font-medium text-emerald-900" th:text="${student.name}">Student Name</p>
                                        <p class="text-xs text-emerald-600" th:text="${student.roll}">Roll</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <a th:href="@{/students/{id}(id=${student.id})}"
                                       class="p-2 text-emerald-500 hover:text-emerald-700 hover:bg-emerald-100 rounded-lg transition-colors"
                                       title="View Student">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <!-- Drop button only for teachers -->
                                    <form th:if="${user.teacher}"
                                          th:action="@{/courses/{courseId}/students/{studentId}/drop(courseId=${course.id},studentId=${student.id})}"
                                          method="post"
                                          onsubmit="return confirm('Are you sure you want to drop this student from the course?');">
                                        <button type="submit" class="p-2 text-red-500 hover:text-red-700 hover:bg-red-100 rounded-lg transition-colors" title="Drop Student">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Enroll Students (Teachers Only) -->
                    <div th:if="${user.teacher}" class="border-t border-gray-100 pt-8 mb-8">
                        <h3 class="flex items-center text-lg font-bold text-gray-900 mb-4">
                            <div class="w-8 h-8 rounded-lg bg-primary-100 flex items-center justify-center mr-3">
                                <i class="fas fa-user-plus text-primary-600 text-sm"></i>
                            </div>
                            Enroll Students
                        </h3>
                        <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
                            <div th:if="${allStudents == null || allStudents.isEmpty()}" class="text-gray-400 text-center py-4">
                                No students available
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3" th:unless="${allStudents == null || allStudents.isEmpty()}">
                                <div th:each="student : ${allStudents}"
                                      th:if="${enrolledStudents == null || !#lists.contains(enrolledStudents.![id], student.id)}"
                                      class="flex items-center justify-between px-4 py-3 bg-white hover:bg-primary-50 rounded-xl border border-gray-200 hover:border-primary-200 transition-all">
                                    <div class="flex items-center">
                                        <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center mr-3">
                                            <i class="fas fa-user text-gray-500"></i>
                                        </div>
                                        <div>
                                            <p class="font-medium text-gray-700" th:text="${student.name}">Student Name</p>
                                            <p class="text-xs text-gray-500" th:text="${student.roll}">Roll</p>
                                        </div>
                                    </div>
                                    <form th:action="@{/courses/{courseId}/students/{studentId}/enroll(courseId=${course.id},studentId=${student.id})}"
                                          method="post">
                                        <button type="submit" class="p-2 text-primary-500 hover:text-primary-700 hover:bg-primary-100 rounded-lg transition-colors" title="Enroll Student">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-100" sec:authorize="hasRole('TEACHER')">
                        <a th:href="@{/courses/{id}/edit(id=${course.id})}"
                           class="flex-1 text-center px-6 py-3 btn-primary text-white rounded-xl font-medium shadow-lg shadow-primary-500/30">
                            <i class="fas fa-edit mr-2"></i> Edit Course
                        </a>
                        <form th:action="@{/courses/{id}/delete(id=${course.id})}" method="post" class="flex-1"
                              onsubmit="return confirm('Are you sure you want to delete this course?');">
                            <button type="submit" class="w-full px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-medium transition-colors">
                                <i class="fas fa-trash mr-2"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
