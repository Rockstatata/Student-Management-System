<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Course Details')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Back Button -->
            <a href="/courses" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-6">
                <i class="fas fa-arrow-left mr-2"></i> Back to Courses
            </a>

            <!-- Course Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="gradient-bg px-6 py-8">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="p-4 rounded-full bg-white/20">
                                <i class="fas fa-book text-white text-2xl"></i>
                            </div>
                            <div class="ml-4">
                                <h1 class="text-2xl font-bold text-white" th:text="${course.name}">Course Name</h1>
                                <p class="text-white/70" th:text="${course.departmentName}">Department</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-3xl font-bold text-white" th:text="${course.credits ?: 'N/A'}">3</span>
                            <p class="text-white/70">Credits</p>
                        </div>
                    </div>
                </div>

                <div class="p-6">
                    <!-- Description -->
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wide mb-2">Description</h3>
                        <p class="text-gray-700" th:text="${course.description ?: 'No description available'}">
                            Description text
                        </p>
                    </div>

                    <!-- Stats -->
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="text-center p-4 bg-green-50 rounded-lg">
                            <p class="text-2xl font-bold text-green-700" th:text="${course.studentCount}">0</p>
                            <p class="text-sm text-green-600">Students Enrolled</p>
                        </div>
                        <div class="text-center p-4 bg-purple-50 rounded-lg">
                            <p class="text-2xl font-bold text-purple-700" th:text="${course.departmentName}">Dept</p>
                            <p class="text-sm text-purple-600">Department</p>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex space-x-4 pt-4 border-t" sec:authorize="hasRole('TEACHER')">
                        <a th:href="@{/courses/{id}/edit(id=${course.id})}"
                           class="flex-1 text-center px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors">
                            <i class="fas fa-edit mr-2"></i> Edit Course
                        </a>
                        <form th:action="@{/courses/{id}/delete(id=${course.id})}" method="post" class="flex-1"
                              onsubmit="return confirm('Are you sure you want to delete this course?');">
                            <button type="submit" class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                                <i class="fas fa-trash mr-2"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
