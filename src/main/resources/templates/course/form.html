<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${course.id != null ? 'Edit Course' : 'New Course'})}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Back Button -->
            <a href="/courses" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-6">
                <i class="fas fa-arrow-left mr-2"></i> Back to Courses
            </a>

            <!-- Form Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="gradient-bg px-6 py-6">
                    <h1 class="text-xl font-bold text-white">
                        <i class="fas fa-book mr-2"></i>
                        <span th:text="${course.id != null ? 'Edit Course' : 'Create New Course'}">Course Form</span>
                    </h1>
                </div>

                <div class="p-6">
                    <!-- Error Message -->
                    <div th:if="${errorMessage}" class="bg-red-50 border-l-4 border-red-400 p-4 rounded-r-lg mb-6">
                        <div class="flex items-center">
                            <i class="fas fa-exclamation-circle text-red-400 mr-3"></i>
                            <p class="text-red-700" th:text="${errorMessage}">Error</p>
                        </div>
                    </div>

                    <form th:action="${course.id != null ? '/courses/' + course.id + '/edit' : '/courses/new'}"
                          th:object="${course}"
                          method="post"
                          class="space-y-6">

                        <!-- Name Field -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-tag text-gray-400 mr-1"></i> Course Name *
                            </label>
                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                   th:classappend="${#fields.hasErrors('name')} ? 'border-red-500' : ''"
                                   placeholder="e.g., Data Structures">
                            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-red-600"></p>
                        </div>

                        <!-- Department Field -->
                        <div>
                            <label for="departmentId" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-building text-gray-400 mr-1"></i> Department *
                            </label>
                            <select id="departmentId"
                                    th:field="*{departmentId}"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                    th:classappend="${#fields.hasErrors('departmentId')} ? 'border-red-500' : ''">
                                <option value="">Select a department</option>
                                <option th:each="dept : ${departments}"
                                        th:value="${dept.id}"
                                        th:text="${dept.name}">Department</option>
                            </select>
                            <p th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}" class="mt-1 text-sm text-red-600"></p>
                        </div>

                        <!-- Credits Field -->
                        <div>
                            <label for="credits" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-star text-gray-400 mr-1"></i> Credits
                            </label>
                            <input type="number"
                                   id="credits"
                                   th:field="*{credits}"
                                   min="1"
                                   max="10"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                   th:classappend="${#fields.hasErrors('credits')} ? 'border-red-500' : ''"
                                   placeholder="e.g., 3">
                            <p th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}" class="mt-1 text-sm text-red-600"></p>
                        </div>

                        <!-- Description Field -->
                        <div>
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-align-left text-gray-400 mr-1"></i> Description
                            </label>
                            <textarea id="description"
                                      th:field="*{description}"
                                      rows="4"
                                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                      th:classappend="${#fields.hasErrors('description')} ? 'border-red-500' : ''"
                                      placeholder="Brief description of the course..."></textarea>
                            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-1 text-sm text-red-600"></p>
                        </div>

                        <!-- Submit Button -->
                        <div class="flex space-x-4 pt-4">
                            <button type="submit"
                                    class="flex-1 gradient-bg text-white py-3 px-4 rounded-lg font-medium hover:opacity-90 transition-opacity shadow-lg">
                                <i class="fas fa-save mr-2"></i>
                                <span th:text="${course.id != null ? 'Update Course' : 'Create Course'}">Save</span>
                            </button>
                            <a href="/courses"
                               class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors text-center">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
