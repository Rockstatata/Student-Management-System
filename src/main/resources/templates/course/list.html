<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Courses')}"></head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
            <!-- Alerts -->
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-sky-100 flex items-center justify-center">
                        <i class="fas fa-book text-sky-600 text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Courses</h1>
                        <p class="text-gray-500">Manage academic courses</p>
                    </div>
                </div>
                <div class="mt-4 md:mt-0" sec:authorize="hasRole('TEACHER')">
                    <a href="/courses/new"
                       class="inline-flex items-center px-5 py-2.5 btn-primary text-white rounded-xl font-medium shadow-lg shadow-primary-500/30">
                        <i class="fas fa-plus mr-2"></i> Add Course
                    </a>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="bg-white rounded-2xl border border-gray-100 p-5 mb-6">
                <form method="get" action="/courses" class="flex flex-wrap items-end gap-4">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Filter by Department</label>
                        <select name="departmentId"
                                onchange="this.form.submit()"
                                class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all">
                            <option value="">All Departments</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}"
                                    th:selected="${dept.id == selectedDepartmentId}">Department</option>
                        </select>
                    </div>
                    <a href="/courses" class="px-4 py-2.5 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-xl transition-colors">
                        <i class="fas fa-times mr-1"></i> Clear
                    </a>
                </form>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(courses)}" class="text-center py-16 bg-white rounded-2xl border border-gray-100">
                <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-book text-3xl text-gray-400"></i>
                </div>
                <p class="text-gray-500 text-lg mb-4">No courses found</p>
                <a href="/courses/new" class="inline-flex items-center text-primary-600 hover:text-primary-700 font-medium" sec:authorize="hasRole('TEACHER')">
                    <i class="fas fa-plus mr-2"></i> Create your first course
                </a>
            </div>

            <!-- Courses Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" th:unless="${#lists.isEmpty(courses)}">
                <div th:each="course : ${courses}"
                     class="bg-white rounded-2xl border border-gray-100 overflow-hidden card-hover">
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center">
                                <div class="w-12 h-12 rounded-xl bg-sky-100 flex items-center justify-center">
                                    <i class="fas fa-book text-sky-600"></i>
                                </div>
                                <div class="ml-4">
                                    <h3 class="text-lg font-bold text-gray-900" th:text="${course.name}">Course Name</h3>
                                    <span class="text-sm text-gray-500" th:text="${course.departmentName}">Department</span>
                                </div>
                            </div>
                            <span class="px-3 py-1 bg-primary-100 text-primary-700 rounded-lg text-sm font-bold"
                                  th:text="${course.credits != null ? course.credits + ' cr' : 'N/A'}">3 cr</span>
                        </div>
                        <p class="text-gray-500 text-sm line-clamp-2 mb-4" th:text="${course.description ?: 'No description available'}">
                            Description
                        </p>
                        <div class="flex items-center text-sm text-emerald-600 bg-emerald-50 px-3 py-2 rounded-lg">
                            <i class="fas fa-user-graduate mr-2"></i>
                            <span th:text="${course.studentCount}">0</span> students enrolled
                        </div>
                    </div>
                    <div class="px-6 py-4 bg-gray-50/50 border-t border-gray-100 flex justify-between items-center">
                        <a th:href="@{/courses/{id}(id=${course.id})}"
                           class="text-primary-600 hover:text-primary-700 text-sm font-medium">
                            View Details <i class="fas fa-arrow-right ml-1"></i>
                        </a>
                        <div class="flex space-x-1" sec:authorize="hasRole('TEACHER')">
                            <a th:href="@{/courses/{id}/edit(id=${course.id})}"
                               class="p-2 text-gray-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/courses/{id}/delete(id=${course.id})}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this course?');">
                                <button type="submit" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
