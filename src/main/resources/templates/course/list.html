<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Courses')}"></head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Alerts -->
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Page Header -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">
                        <i class="fas fa-book text-blue-600 mr-2"></i> Courses
                    </h1>
                    <p class="mt-2 text-gray-600">Manage academic courses</p>
                </div>
                <div class="mt-4 md:mt-0" sec:authorize="hasRole('TEACHER')">
                    <a href="/courses/new"
                       class="inline-flex items-center px-4 py-2 gradient-bg text-white rounded-lg hover:opacity-90 transition-opacity shadow-md">
                        <i class="fas fa-plus mr-2"></i> Add Course
                    </a>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6">
                <form method="get" action="/courses" class="flex flex-wrap items-center gap-4">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Department</label>
                        <select name="departmentId"
                                onchange="this.form.submit()"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                            <option value="">All Departments</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}"
                                    th:selected="${dept.id == selectedDepartmentId}">Department</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <a href="/courses" class="px-4 py-2 text-gray-600 hover:text-gray-900">
                            <i class="fas fa-times mr-1"></i> Clear Filter
                        </a>
                    </div>
                </form>
            </div>

            <!-- Courses Grid -->
            <div th:if="${#lists.isEmpty(courses)}" class="text-center py-12 bg-white rounded-xl shadow-sm">
                <i class="fas fa-book text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg">No courses found</p>
                <a href="/courses/new" class="mt-4 inline-flex items-center text-primary-600 hover:text-primary-700" sec:authorize="hasRole('TEACHER')">
                    <i class="fas fa-plus mr-1"></i> Create your first course
                </a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" th:unless="${#lists.isEmpty(courses)}">
                <div th:each="course : ${courses}"
                     class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden card-hover">
                    <div class="p-6">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center">
                                <div class="p-3 rounded-full bg-blue-100">
                                    <i class="fas fa-book text-blue-600"></i>
                                </div>
                                <div class="ml-4">
                                    <h3 class="text-lg font-semibold text-gray-900" th:text="${course.name}">Course Name</h3>
                                    <span class="text-sm text-gray-500" th:text="${course.departmentName}">Department</span>
                                </div>
                            </div>
                            <span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-sm font-medium"
                                  th:text="${course.credits != null ? course.credits + ' cr' : 'N/A'}">3 cr</span>
                        </div>
                        <p class="mt-4 text-gray-600 text-sm line-clamp-2" th:text="${course.description ?: 'No description available'}">
                            Description
                        </p>
                        <div class="mt-4 flex items-center text-sm text-gray-500">
                            <i class="fas fa-user-graduate mr-1"></i>
                            <span th:text="${course.studentCount}">0</span> students enrolled
                        </div>
                    </div>
                    <div class="px-6 py-3 bg-gray-50 border-t flex justify-between items-center">
                        <a th:href="@{/courses/{id}(id=${course.id})}"
                           class="text-primary-600 hover:text-primary-700 text-sm font-medium">
                            <i class="fas fa-eye mr-1"></i> View Details
                        </a>
                        <div class="flex space-x-2" sec:authorize="hasRole('TEACHER')">
                            <a th:href="@{/courses/{id}/edit(id=${course.id})}"
                               class="text-gray-500 hover:text-gray-700 p-2">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/courses/{id}/delete(id=${course.id})}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this course?');">
                                <button type="submit" class="text-red-500 hover:text-red-700 p-2">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
