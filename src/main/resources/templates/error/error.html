<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md text-center">
        <!-- Error Icon -->
        <div class="inline-flex items-center justify-center w-24 h-24 bg-red-100 rounded-3xl mb-8">
            <i class="fas fa-exclamation-triangle text-5xl text-red-500"></i>
        </div>

        <!-- Error Card -->
        <div class="bg-white rounded-2xl shadow-xl shadow-gray-200/50 p-8 border border-gray-100">
            <h1 class="text-2xl font-bold text-gray-900 mb-3" th:text="${errorTitle ?: 'Oops! Something went wrong'}">Error</h1>
            <p class="text-gray-500 mb-8" th:text="${error ?: 'An unexpected error occurred'}">Error message</p>

            <div class="space-y-3">
                <a href="/dashboard"
                   class="block w-full btn-primary text-white py-3.5 px-4 rounded-xl font-semibold shadow-lg shadow-primary-500/30">
                    <i class="fas fa-home mr-2"></i> Go to Dashboard
                </a>
                <a href="javascript:history.back()"
                   class="block w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-3.5 px-4 rounded-xl font-medium transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i> Go Back
                </a>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-gray-400 text-sm mt-8">
            © 2026 Student Management System
        </p>
    </div>
</body>
</html>
