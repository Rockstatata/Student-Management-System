<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="min-h-screen gradient-bg flex items-center justify-center">
    <div class="w-full max-w-md text-center">
        <!-- Error Icon -->
        <div class="inline-flex items-center justify-center w-24 h-24 bg-white/20 rounded-full mb-6">
            <i class="fas fa-exclamation-triangle text-5xl text-white"></i>
        </div>

        <!-- Error Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2" th:text="${errorTitle ?: 'Oops! Something went wrong'}">Error</h1>
            <p class="text-gray-600 mb-6" th:text="${error ?: 'An unexpected error occurred'}">Error message</p>

            <div class="space-y-3">
                <a href="/dashboard"
                   class="block w-full gradient-bg text-white py-3 px-4 rounded-lg font-medium hover:opacity-90 transition-opacity">
                    <i class="fas fa-home mr-2"></i> Go to Dashboard
                </a>
                <a href="javascript:history.back()"
                   class="block w-full border border-gray-300 text-gray-700 py-3 px-4 rounded-lg font-medium hover:bg-gray-50 transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i> Go Back
                </a>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-white/60 text-sm mt-8">
            © 2026 Student Management System
        </p>
    </div>
</body>
</html>
