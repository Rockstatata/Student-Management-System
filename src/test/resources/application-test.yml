spring:
  application:
    name: Student-Management-System-Test

  # H2 In-Memory Database Configuration for Testing
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  # H2 Console (useful for debugging tests)
  h2:
    console:
      enabled: true

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false

  # Disable Docker Compose integration in tests
  docker:
    compose:
      enabled: false

  # Thymeleaf Configuration
  thymeleaf:
    cache: false

# Logging Configuration
logging:
  level:
    com.sarwad.sms.studentmanagementsystem: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
